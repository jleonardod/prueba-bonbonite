webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = ["--headless=new", "--disable-gpu", "--window-size=1366,768"]
    }
  }
}

serenity {
  take.screenshots = FOR_FAILURES
  restart.browser.each.scenario = false
}

environments {
  default {
    webdriver.base.url = "https://www.bon-bonite.com"
  }
}